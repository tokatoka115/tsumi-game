<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>罪を償いましょう - Phase 4</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --panel-bg: rgba(22, 22, 44, 0.9);
            --border-gold: #c5a059;
            --text-main: #e0e0e0;
            --accent-red: #ff4d4d;
            --accent-blue: #4d94ff;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --hp-green: #44ff44;
            --hp-red: #ff4444;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(61, 61, 115, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(61, 61, 115, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }
        header { text-align: center; padding: 20px 0; border-bottom: 2px solid var(--border-gold); margin-bottom: 30px; text-shadow: 0 0 10px rgba(197, 160, 89, 0.5); }
        h1 { margin: 0; letter-spacing: 2px; color: var(--border-gold); font-size: 2rem; text-transform: uppercase; }
        .screen { display: none; animation: fadeIn 0.3s ease-out forwards; }
        .screen.active { display: block; }
        .main-panel { background: var(--panel-bg); border: 2px solid var(--border-gold); border-radius: 8px; padding: 20px; box-shadow: 0 10px 30px var(--shadow-color); }
        form { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex-grow: 1; padding: 12px; background: #0f0f1d; border: 1px solid var(--border-gold); border-radius: 4px; color: #fff; font-size: 1rem; outline: none; }
        button { padding: 10px 25px; background: linear-gradient(180deg, #ff6b6b 0%, #cc0000 100%); border: 1px solid #990000; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        button:hover { transform: translateY(-1px); }
        button.secondary { background: linear-gradient(180deg, #4d94ff 0%, #0044cc 100%); border-color: #002266; }
        button.gold { background: linear-gradient(180deg, #c5a059 0%, #8a6d3b 100%); border-color: #5e4a28; color: #1a1a2e; }
        .nav-actions { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        .filter-actions { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .filter-btn { padding: 6px 12px; font-size: 0.8rem; background: #2a2a4a; border: 1px solid var(--border-gold); color: var(--border-gold); border-radius: 4px; cursor: pointer; }
        .filter-btn.active { background: var(--border-gold); color: #1a1a2e; }
        .hp-bar-bg { background: #333; height: 20px; border-radius: 10px; border: 1px solid var(--border-gold); overflow: hidden; margin: 10px 0; }
        .hp-bar-fill { height: 100%; background: var(--hp-green); width: 100%; transition: width 0.1s ease-out; }
        .hp-bar-fill.low { background: var(--hp-red); }
        ul { list-style: none; padding: 0; margin-top: 20px; }
        li { background: linear-gradient(90deg, #2a2a4a 0%, #1a1a2e 100%); border: 1px solid rgba(197, 160, 89, 0.3); border-radius: 6px; padding: 10px 15px; margin-bottom: 8px; }
        li.defeated { opacity: 0.5; filter: grayscale(1); }
        .monster-info { display: flex; flex-direction: column; }
        .monster-name { font-weight: bold; }
        .date { font-size: 0.75rem; color: #888; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }
        .shake { animation: shake 0.15s ease-in-out; }
        .flash-status { animation: flash 0.3s ease-out; }
        @keyframes flash { 0% { color: #fff; } 100% { color: inherit; } }
    </style>
</head>
<body>
    <header><h1>罪を償いましょう</h1></header>
    <div id="input-screen" class="screen active">
        <div class="main-panel">
            <div id="microbit-panel" style="text-align:center; margin-bottom: 16px;">
                <span id="microbit-status">🔴 micro:bit 未接続</span>
                <button id="microbit-connect-btn" class="secondary" style="margin-left: 12px;">micro:bit を接続</button>
            </div>
            <form id="food-form"><input type="text" id="food-input" placeholder="召喚する食べ物を入力..." required><button type="submit">召喚</button></form>
            <div class="nav-actions"><button id="go-battle-btn" class="gold">討伐へ向かう</button><button id="go-encyclopedia-btn" class="secondary">図鑑を見る</button></div>
            <div id="monster-list-container"><h2 style="font-size: 1.1rem; color: var(--border-gold); margin-top: 20px;">出現中のモンスター</h2><ul id="monster-list"></ul></div>
        </div>
    </div>
    <div id="battle-screen" class="screen">
        <div class="main-panel">
            <div id="battle-monster-name" style="font-size: 1.5rem; text-align: center; margin-bottom: 20px; color: var(--border-gold);"></div>
            <div id="enemy-sprite" style="width:120px; height:120px; background:radial-gradient(circle, #ff4d4d 0%, #800000 100%); margin:0 auto; border-radius: 50%; border: 3px solid var(--border-gold);"></div>
            <div style="margin-top: 20px;">
                <div style="display:flex; justify-content:space-between; font-size:0.9rem;"><span>敵のHP</span><span id="enemy-hp-text"></span></div>
                <div class="hp-bar-bg"><div id="enemy-hp-bar" class="hp-bar-fill"></div></div>
            </div>
            <div style="margin-top: 10px;">
                <div style="display:flex; justify-content:space-between; font-size:0.9rem;"><span>自分のHP</span><span id="player-hp-text"></span></div>
                <div class="hp-bar-bg"><div id="player-hp-bar" class="hp-bar-fill"></div></div>
            </div>
        </div>
    </div>
    <div id="gameover-screen" class="screen"><div class="main-panel" style="text-align:center;"><h2 style="color:var(--hp-red);">GAME OVER</h2><p>あなたは力尽きた...</p><div class="nav-actions"><button id="retry-btn">もう一度討伐へ</button><button id="back-input-btn-go" class="secondary">戻る</button></div></div></div>
    <div id="victory-screen" class="screen"><div class="main-panel" style="text-align:center;"><h2 style="color:var(--hp-green);">VICTORY!</h2><p>全てのモンスターを討伐しました！</p><div class="nav-actions"><button id="back-input-btn-vic" class="secondary">戻る</button></div></div></div>
    <div id="encyclopedia-screen" class="screen">
        <div class="main-panel">
            <h2 style="font-size: 1.5rem; text-align: center; margin-bottom: 20px; color: var(--border-gold);">罪の記録 (図鑑)</h2>
            <div class="filter-actions">
                <button class="filter-btn active" data-filter="all">すべて</button>
                <button class="filter-btn" data-filter="undefeated">未討伐</button>
                <button class="filter-btn" data-filter="defeated">討伐済み</button>
            </div>
            <div style="max-height: 400px; overflow-y: auto;"><ul id="encyclopedia-list"></ul></div>
            <div class="nav-actions"><button id="back-from-encyclopedia-btn" class="secondary">戻る</button></div>
        </div>
    </div>
    <script>
        const STORAGE_KEY = "tsumi_game_monsters";
        let playerHP = 100, enemyHP = 50, currentMonster = null, battleInterval = null, currentFilter = "all";
        let enemyAttackCount = 0;
        let microbitPort = null, microbitReader = null;

        if (!("serial" in navigator)) {
            document.getElementById("microbit-status").textContent = "❌ ブラウザ非対応 (Chrome/Edge推奨)";
            document.getElementById("microbit-connect-btn").style.display = "none";
        }

        async function connectMicrobit() {
          const statusEl = document.getElementById("microbit-status");
          const btnEl = document.getElementById("microbit-connect-btn");
          try {
            if (microbitReader) { await microbitReader.cancel(); microbitReader = null; }
            if (microbitPort) { await microbitPort.close(); microbitPort = null; }
            microbitPort = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x0d28 }] });
            await microbitPort.open({ baudRate: 115200 });
            const decoder = new TextDecoderStream();
            microbitPort.readable.pipeTo(decoder.writable);
            microbitReader = decoder.readable.getReader();
            statusEl.textContent = "🟢 micro:bit 接続中";
            btnEl.textContent = "接続済み"; btnEl.disabled = true;
            readMicrobitLoop();
          } catch (err) {
            console.error(err); statusEl.textContent = "🔴 接続失敗: " + err.message.split(":")[0];
          }
        }

        let attackQueue = 0;
        let isProcessingAttack = false;

        async function processAttackQueue() {
            if (isProcessingAttack) return;
            isProcessingAttack = true;
            const statusEl = document.getElementById("microbit-status");
            while (attackQueue > 0) {
                attackQueue--;
                if (statusEl) {
                    statusEl.classList.remove("flash-status");
                    void statusEl.offsetWidth;
                    statusEl.classList.add("flash-status");
                }
                playerAttack();
                await new Promise(resolve => setTimeout(resolve, 50));
            }
            isProcessingAttack = false;
        }

        async function readMicrobitLoop() {
          const statusEl = document.getElementById("microbit-status");
          let buffer = "";
          try {
            while (true) {
              const { value, done } = await microbitReader.read();
              if (done) break;
              buffer += value;
              const lines = buffer.split("\n");
              buffer = lines.pop();
              for (const line of lines) {
                if (line.trim() === "ATTACK") {
                    attackQueue++;
                    processAttackQueue();
                }
              }
            }
          } catch (err) { 
            console.error("Read Error:", err);
            statusEl.textContent = "🔴 切断されました";
            document.getElementById("microbit-connect-btn").disabled = false;
            document.getElementById("microbit-connect-btn").textContent = "micro:bit を接続";
          }
        }

        function showScreen(id) { document.querySelectorAll(".screen").forEach(s => s.classList.remove("active")); document.getElementById(id).classList.add("active"); if (id !== "battle-screen") { clearInterval(battleInterval); attackQueue = 0; } }
        function getMonsters() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
        function saveMonsters(m) { localStorage.setItem(STORAGE_KEY, JSON.stringify(m)); }
        function addMonster(f) { const m = getMonsters(); m.push({ id: Date.now(), food: f, defeated: false, createdAt: new Date().toLocaleDateString() }); saveMonsters(m); renderMonsters(); }
        
        function renderMonsters() {
            const m = getMonsters(); const list = document.getElementById("monster-list"); list.innerHTML = "";
            m.forEach(x => {
                const li = document.createElement("li"); if (x.defeated) li.classList.add("defeated");
                li.innerHTML = '<div class="monster-info"><span class="monster-name">' + x.food + '</span><span class="date">出現日: ' + x.createdAt + ' ' + (x.defeated ? "(討伐済)" : "") + '</span></div>';
                list.appendChild(li);
            });
            document.getElementById("go-battle-btn").disabled = m.filter(x => !x.defeated).length === 0;
        }

        function renderEncyclopedia() {
            const m = getMonsters(); const list = document.getElementById("encyclopedia-list"); list.innerHTML = "";
            const filtered = m.filter(x => { if (currentFilter === "undefeated") return !x.defeated; if (currentFilter === "defeated") return x.defeated; return true; });
            if (filtered.length === 0) { list.innerHTML = "<p style='text-align:center; color:#888; padding:20px;'>記録がありません</p>"; return; }
            filtered.forEach(x => {
                const li = document.createElement("li"); li.style.borderLeft = x.defeated ? "4px solid var(--hp-green)" : "4px solid var(--accent-red)";
                li.innerHTML = '<div class="monster-info"><span class="monster-name">' + x.food + '</span><span class="date">登録日: ' + x.createdAt + ' - ' + (x.defeated ? "討伐済み" : "未討伐") + '</span></div>';
                list.appendChild(li);
            });
        }

        function startBattleFlow() { const undefeated = getMonsters().filter(x => !x.defeated); if (undefeated.length === 0) { showScreen("victory-screen"); return; } currentMonster = undefeated[0]; playerHP = 100; enemyHP = 50; enemyAttackCount = 0; setupBattle(); showScreen("battle-screen"); startEnemyAttack(); }
        function setupBattle() { document.getElementById("battle-monster-name").textContent = currentMonster.food; updateUI(); }
        function updateUI() {
            document.getElementById("player-hp-bar").style.width = playerHP + "%"; 
            document.getElementById("player-hp-text").textContent = Math.ceil(playerHP) + "/100";
            document.getElementById("player-hp-bar").classList.toggle("low", playerHP <= 30);
            
            document.getElementById("enemy-hp-bar").style.width = (enemyHP/50*100) + "%"; 
            document.getElementById("enemy-hp-text").textContent = Math.ceil(enemyHP) + "/50";
            document.getElementById("enemy-hp-bar").classList.toggle("low", enemyHP <= 15);
        }

        function playerAttack() {
            if (playerHP <= 0 || enemyHP <= 0) return;
            enemyHP = Math.max(0, enemyHP - 2); updateUI();
            const s = document.getElementById("enemy-sprite");
            s.classList.remove("shake"); void s.offsetWidth;
            s.classList.add("shake");
            if (enemyHP <= 0) monsterDefeated();
        }

        function startEnemyAttack() { 
            clearInterval(battleInterval); 
            battleInterval = setInterval(() => { 
                if (playerHP > 0 && enemyHP > 0) { 
                    const isSpecial = Math.random() < 0.2;
                    const damage = isSpecial ? 25 : 10;
                    playerHP = Math.max(0, playerHP - damage); 
                    updateUI(); 
                    if (playerHP <= 0) { clearInterval(battleInterval); showScreen("gameover-screen"); } 
                } 
            }, 1000); 
        }
        function monsterDefeated() { const m = getMonsters(); const i = m.findIndex(x => x.id === currentMonster.id); m[i].defeated = true; saveMonsters(m); renderMonsters(); if (m.filter(x => !x.defeated).length > 0) { setTimeout(startBattleFlow, 500); } else { showScreen("victory-screen"); } }

        document.getElementById("food-form").addEventListener("submit", e => { e.preventDefault(); const val = document.getElementById("food-input").value.trim(); if(val) { addMonster(val); document.getElementById("food-input").value = ""; } });
        document.getElementById("go-battle-btn").addEventListener("click", startBattleFlow);
        document.getElementById("microbit-connect-btn").addEventListener("click", connectMicrobit);
        document.getElementById("retry-btn").addEventListener("click", startBattleFlow);
        document.getElementById("back-input-btn-go").addEventListener("click", () => showScreen("input-screen"));
        document.getElementById("back-input-btn-vic").addEventListener("click", () => { showScreen("input-screen"); renderMonsters(); });
        document.getElementById("go-encyclopedia-btn").addEventListener("click", () => { showScreen("encyclopedia-screen"); renderEncyclopedia(); });
        document.getElementById("back-from-encyclopedia-btn").addEventListener("click", () => { showScreen("input-screen"); renderMonsters(); });
        
        document.querySelectorAll(".filter-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active"); currentFilter = btn.dataset.filter; renderEncyclopedia();
            });
        });

        renderMonsters();
    </script>
</body></html>
